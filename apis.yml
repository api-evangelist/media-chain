name: Media Chain
description: >-
  Mediachain (Mediachain Labs) was a decentralized universal media library and
  attribution protocol built on IPFS and blockchain technology, designed to let
  creators and applications collaborate on open metadata about creative works and
  track the provenance and ownership of online images and other media. Founded in
  2016 with seed funding from Andreessen Horowitz and Union Square Ventures, the
  company was acqui-hired by Spotify in April 2017 to help build fair,
  blockchain-based royalty attribution for rightsholders. The company is now
  defunct and its primary domain (mediachain.io) is a parked page, but its
  open-source protocol, design documentation, Protocol Buffer definitions, and
  first-party client libraries (the `aleph`/`mcclient` JavaScript client on npm and
  the `mediachain-client` Python reader on PyPI) remain public under the
  github.com/mediachain organization. This profile was surfaced as an a16z
  portfolio company and enriched from its surviving open-source surface.
